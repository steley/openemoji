<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    background:#fbfbfd; color:#111118;
    background-image:radial-gradient(circle at 88% 12%, #ede9fe 0%, transparent 42%),radial-gradient(circle at 6% 92%, #fce7f3 0%, transparent 40%);
    display:flex; flex-direction:column; justify-content:center; padding:0 84px; position:relative;
  }
  .badge { display:inline-flex; align-items:center; gap:10px; font-size:22px; font-weight:600; color:#7c3aed; background:#f5f3ff; border:1px solid #ede9fe; padding:10px 20px; border-radius:99px; width:max-content; }
  .logo { display:flex; align-items:center; gap:18px; margin:34px 0 10px; }
  .mark { width:88px; height:88px; border-radius:24px; background:linear-gradient(120deg,#7c3aed,#ec4899 55%,#f97316); display:grid; place-items:center; font-size:50px; box-shadow:0 20px 50px -20px rgba(124,58,237,.45); }
  .name { font-size:62px; font-weight:800; letter-spacing:-2.5px; }
  .name b { background:linear-gradient(120deg,#7c3aed,#ec4899 55%,#f97316); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:44px; font-weight:800; letter-spacing:-1.2px; line-height:1.3; margin-top:18px; }
  h1 span { background:linear-gradient(120deg,#7c3aed,#ec4899 55%,#f97316); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { font-size:24px; color:#6e6e7a; margin-top:16px; line-height:1.5; }
  .row { position:absolute; right:70px; top:0; height:100%; width:250px; display:grid; grid-template-columns:repeat(2,1fr); align-content:center; gap:14px 8px; font-size:54px; text-align:center; line-height:1.1; }
  .row div { filter:none; }
  .bar { display:flex; align-items:center; gap:12px; margin-top:30px; }
  .pill { font-size:20px; color:#6e6e7a; background:#fff; border:1px solid #e8e8ee; border-radius:99px; padding:12px 22px; box-shadow:0 8px 24px -16px rgba(17,17,24,.2); }
</style>
</head>
<body>
  <span class="badge">✨ 已收录 Emoji 17.0 · 1870 个</span>
  <div class="logo"><div class="mark">😀</div><div class="name">Open<b>Emoji</b></div></div>
  <h1>每个 emoji 的意思，<span>一查便知</span></h1>
  <p class="sub">中英文含义 · 真实使用场景 · 一键复制</p>
  <div class="bar"><span class="pill">🔥 火焰</span><span class="pill">💀 骷髅＝笑死</span><span class="pill">🥺 求你了</span></div>
  <div class="row">😀😂🥰💀🔥✨🥺👍🙏💯🎉❤️</div>
</body>
</html>
